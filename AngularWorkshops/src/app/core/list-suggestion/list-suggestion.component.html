<div class="container">
  <h2>Liste des suggestions</h2>

  <!-- Barre de recherche (Two-way binding) -->
  <div class="search-bar">
    <input
      type="text"
      [(ngModel)]="searchTerm"
      placeholder="Filtrer par titre ou catégorie..."
      class="search-input"
    />
  </div>

  <!-- Liste des suggestions -->
  <div class="suggestions-list">
    <div *ngFor="let suggestion of filteredSuggestions" class="suggestion-card">
      <h3>{{ suggestion.title }}</h3>
      <p>{{ suggestion.description }}</p>
      <p><strong>Catégorie :</strong> {{ suggestion.category }}</p>
      <p><strong>Date :</strong> {{ suggestion.date | date:'dd/MM/yyyy' }}</p>
      <p><strong>Statut :</strong> {{ suggestion.status }}</p>
      <p><strong>Likes :</strong> {{ suggestion.nbLikes }}</p>

      <!-- Boutons : affichés seulement si la suggestion n'est pas refusée -->
      <div *ngIf="!isRefused(suggestion)" class="buttons">
        <button (click)="like(suggestion)" class="btn-like">👍 Like</button>
        <button (click)="addToFavorites(suggestion)" class="btn-fav">⭐ Ajouter aux favoris</button>
      </div>
    </div>
  </div>

  <!-- Affichage des favoris -->
  <div class="favorites" *ngIf="favorites.length > 0">
    <h3>Mes favoris ({{ favorites.length }})</h3>
    <ul>
      <li *ngFor="let fav of favorites">{{ fav.title }}</li>
    </ul>
  </div>
</div>
